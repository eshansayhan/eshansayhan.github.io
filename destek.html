    <!-- Kopyalama İşlevi Script'i -->
    <script>
        function copyIban() {
            var ibanText = document.getElementById("iban-text").innerText;
            // Boşlukları temizle (Eğer boşluklu yazılırsa)
            ibanText = ibanText.replace(/\s+/g, '');
            
            navigator.clipboard.writeText(ibanText).then(function() {
                var copyBtn = document.getElementById("copyBtn");
                var originalHtml = copyBtn.innerHTML;
                
                copyBtn.innerHTML = '<i class="fa-solid fa-check"></i> Kopyalandı!';
                copyBtn.style.background = '#4CAF50';
                copyBtn.style.color = '#fff';
                
                setTimeout(function() {
                    copyBtn.innerHTML = originalHtml;
                    copyBtn.style.background = '#20D5EC';
                    copyBtn.style.color = '#000';
                }, 3000);
            }).catch(function(err) {
                console.error('Kopyalama işlemi başarısız: ', err);
                alert("Kopyalama başarısız oldu. Lütfen manuel olarak kopyalayınız.");
            });
        }
    </script>
