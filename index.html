<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ziyaretçi Defteri & Profiller</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    
    <div class="container">
        <header class="fade-in">
            <h1>Ziyaretçi Defteri</h1>
            <p>Bir yorum bırakın, otomatik olarak bir profil sayfası kazanın ve sitenize backlink sağlayın.</p>
        </header>

        <main>
            <div class="content-wrapper">
                <section class="glass-card form-section slide-up">
                    <h2>Yorum Yap</h2>
                    <form id="commentForm">
                        <div class="form-group">
                            <label for="name">Ad Soyad</label>
                            <input type="text" id="name" name="name" required placeholder="John Doe" autocomplete="name">
                        </div>
                        
                        <div class="form-group">
                            <label for="website">Web Siteniz</label>
                            <input type="url" id="website" name="website" required placeholder="https://sizinsiteniz.com" autocomplete="url">
                        </div>
                        
                        <div class="form-group">
                            <label for="comment">Yorumunuz</label>
                            <textarea id="comment" name="comment" rows="4" required placeholder="Harika bir proje..."></textarea>
                        </div>
                        
                        <button type="submit" class="btn-primary" id="submitBtn">
                            <span class="btn-text">Gönder</span>
                            <div class="loader" id="btnLoader"></div>
                        </button>
                        <div id="statusMessage" class="status-message"></div>
                    </form>
                </section>

                <section class="glass-card profiles-section slide-up delay-1">
                    <h2>Profiller</h2>
                    <p class="subtitle">Son yorum yapanların profilleri burada listelenir.</p>
                    <div class="profiles-list" id="profilesList">
                        <!-- PROFILES_START -->
                        <!-- PROFILES_END -->
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
