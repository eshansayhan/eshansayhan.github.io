name: Lighthouse CI

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - name: Repository'i indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lighthouse CI kur
        run: npm install -g @lhci/cli@0.15.x

      - name: Lighthouse çalıştır
        run: |
          lhci autorun
